name: Normalize Content Manifest

on:
  push:
    paths:
      - 'content-index.json'
      - 'content/**'
  pull_request:
    paths:
      - 'content-index.json'
      - 'content/**'
  workflow_dispatch:

jobs:
  normalize-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize manifest
        run: node scripts/normalize-manifest.mjs

      - name: Detect manifest changes
        id: detect
        shell: bash
        run: |
          if git diff --quiet -- content-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail PR if manifest is not normalized
        if: github.event_name == 'pull_request' && steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          echo "content-index.json is not normalized. Run: node scripts/normalize-manifest.mjs"
          git --no-pager diff -- content-index.json
          exit 1

  normalize-and-commit:
    needs: normalize-check
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && needs.normalize-check.outputs.changed == 'true' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize manifest
        run: node scripts/normalize-manifest.mjs

      - name: Commit normalized manifest
        shell: bash
        run: |
          if git diff --quiet -- content-index.json; then
            echo "No manifest changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-index.json
          git commit -m "chore: normalize content manifest"
          git push
